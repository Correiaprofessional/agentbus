<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentbus</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #12151c;
    --line: #232936;
    --text: #e6e9ef;
    --muted: #8b93a3;
    --accent: #7c5cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 ui-sans-serif, -apple-system, "SF Pro Text", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    background: #0e1117;
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--accent); }
  .meta { color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: #4b5563; }
  .dot.live { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,0.15); }
  .dot.dead { background: #ef4444; }
  main { flex: 1; display: grid; grid-template-columns: 320px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--line); overflow: auto; background: var(--panel); }
  section { display: flex; flex-direction: column; min-height: 0; }
  h2 {
    margin: 0;
    padding: 10px 16px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
  }
  #plist { padding: 0 8px 16px; }
  .project { padding: 8px; border-radius: 8px; margin-bottom: 4px; }
  .apps { border-bottom: 1px solid var(--line); border-radius: 0; margin-bottom: 8px; padding-bottom: 10px; }
  .project:hover { background: #171b24; }
  .pname { display: flex; align-items: baseline; gap: 6px; font-weight: 600; }
  .branch { color: var(--muted); font-weight: 400; font-size: 11px; }
  .sess { display: flex; align-items: center; gap: 6px; padding: 4px 0 0 2px; color: var(--muted); }
  .sess b { color: var(--text); font-weight: 500; }
  .badge {
    font-size: 10px;
    font-weight: 600;
    padding: 1px 6px;
    border-radius: 999px;
    color: #0b0d12;
    background: var(--c, #6b7280);
  }
  .state { font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .sess.running b { font-weight: 400; color: var(--muted); }
  .badge.ghost { background: transparent; color: var(--c, #6b7280); border: 1px dashed var(--c, #6b7280); }
  .logo { flex: 0 0 auto; display: inline-block; vertical-align: -2px; }
  #msgs { flex: 1; overflow: auto; padding: 0 16px 24px; }
  .msg { display: grid; grid-template-columns: 68px 1fr; gap: 10px; padding: 8px 0; border-top: 1px solid #161a22; }
  .msg:first-child { border-top: 0; }
  .t { color: #5d6577; font-variant-numeric: tabular-nums; font-size: 12px; }
  .head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .who { font-weight: 600; }
  .arrow { color: #5d6577; }
  .who.user { color: var(--accent); }
  .to { font-weight: 500; }
  .to.all { color: var(--muted); }
  .to.tool { color: #60a5fa; }
  .to.session { color: #34d399; }
  .proj { margin-left: 4px; font-size: 11px; color: #5d6577; }
  .text { color: #cfd5e1; white-space: pre-wrap; overflow-wrap: anywhere; }
  .empty { color: var(--muted); padding: 16px; }
  .empty code { color: #c4b5fd; }
  .project { cursor: pointer; }
  .project.sel { background: #1b2030; box-shadow: inset 0 0 0 1px var(--line); }
  .allproj { display: flex; align-items: baseline; gap: 6px; font-weight: 600; }
  .count { margin-left: auto; color: var(--muted); font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
  #brief { border-bottom: 1px solid var(--line); padding: 10px 16px 12px; background: #0e1117; }
  #brief.off textarea { opacity: 0.55; }
  #bproject {
    font: inherit; color: var(--text); background: var(--panel); max-width: 260px;
    border: 1px solid var(--line); border-radius: 7px; padding: 3px 6px;
  }
  #bproject:focus { outline: none; border-color: var(--accent); }
  #bproject:disabled { opacity: 0.5; }
  .brow { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .bname { font-weight: 600; }
  .bstate { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .bstate.ok { color: #22c55e; }
  #brief textarea {
    width: 100%; min-height: 52px; resize: vertical; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit;
  }
  #brief textarea:focus { outline: none; border-color: var(--accent); }
  .bactions { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  #brief button {
    padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line);
    background: #1a1f2a; color: var(--text); font: inherit; cursor: pointer;
  }
  #brief button:hover:not(:disabled) { border-color: var(--accent); }
  #brief button:disabled { opacity: 0.45; cursor: default; }
</style>
</head>
<body>
<header>
  <div class="brand">agent<span>bus</span></div>
  <div class="meta" id="meta">connecting…</div>
  <div class="dot" id="dot"></div>
</header>
<main>
  <aside>
    <h2>Agents by project</h2>
    <div id="plist"></div>
  </aside>
  <section>
    <div id="brief" class="off">
      <div class="brow">
        <span class="bname">Say to</span>
        <select id="bproject" disabled></select>
        <span class="bstate" id="bstate"></span>
      </div>
      <textarea id="btext" rows="2" placeholder="What should the agents in this project know? House rules, what not to touch, where the credentials live. They read it as a message from User."></textarea>
      <div class="bactions">
        <button id="bsave" disabled>Send to these agents</button>
        <span class="bstate" id="bhint">what you send lands in the conversation below, like any other message</span>
      </div>
    </div>
    <h2 id="mtitle">Who is talking to whom</h2>
    <div id="msgs"></div>
  </section>
</main>
<script>
  const token = new URLSearchParams(location.search).get('t') || '';
  const H = { 'x-agentbus-token': token };
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const TOOL_COLORS = {
    freebuff: '#a78bfa', chatgpt: '#34d399', claude: '#e2795b', codex: '#10b981',
    copilot: '#60a5fa', opencode: '#fbbf24', antigravity: '#22d3ee',
  };
  const colorFor = (tool) => TOOL_COLORS[String(tool || '').toLowerCase()] || '#6b7280';

  // Inline marks: the board stays a single offline file with no image requests.
  const hexagon = (c) => `
    <path d="M12 3.1 19.7 7.6v8.8L12 20.9 4.3 16.4V7.6z" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="12" cy="12" r="2.5" fill="${c}"/>`;
  const TOOL_LOGOS = {
    freebuff: (c) => `
      <rect x="2.5" y="2.5" width="19" height="19" rx="6" fill="${c}"/>
      <path d="M13.3 5.2 7.4 13.3h3.7L10.7 18.8l5.9-8.1h-3.7z" fill="#0b0d12"/>`,
    claude: (c) => `
      <g stroke="${c}" stroke-width="2.1" stroke-linecap="round">
        <path d="M12 3.2v17.6M3.2 12h17.6M5.9 5.9l12.2 12.2M18.1 5.9 5.9 18.1"/>
      </g>`,
    codex: (c) => `
      <path d="M4.9 6.2 10 12l-5.1 5.8" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M12.6 17.8h6.3" fill="none" stroke="${c}" stroke-width="2.2" stroke-linecap="round"/>`,
    chatgpt: hexagon,
    copilot: (c) => `
      <path d="M9.4 7.4 12 4l2.6 3.4" fill="none" stroke="${c}" stroke-width="1.9" stroke-linejoin="round"/>
      <path d="M4 14.6c0-4.3 3.6-7.7 8-7.7s8 3.4 8 7.7v1.5a3.4 3.4 0 0 1-3.4 3.4H7.4A3.4 3.4 0 0 1 4 16.1z" fill="${c}"/>
      <circle cx="9.4" cy="14" r="1.35" fill="#0b0d12"/>
      <circle cx="14.6" cy="14" r="1.35" fill="#0b0d12"/>`,
    opencode: (c) => `
      <path d="M8.6 6.4 3.6 12l5 5.6M15.4 6.4 20.4 12l-5 5.6" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M13.3 5.6 10.7 18.4" fill="none" stroke="${c}" stroke-width="2.1" stroke-linecap="round"/>`,
    antigravity: () => `
      <circle cx="12" cy="6.2" r="2.9" fill="#4285f4"/>
      <circle cx="17.8" cy="12" r="2.9" fill="#ea4335"/>
      <circle cx="12" cy="17.8" r="2.9" fill="#fbbc05"/>
      <circle cx="6.2" cy="12" r="2.9" fill="#34a853"/>`,
  };
  const logoFor = (tool) => {
    const key = String(tool || '').toLowerCase();
    const draw = TOOL_LOGOS[key];
    const inner = draw
      ? draw(colorFor(key))
      : `<rect x="2.5" y="2.5" width="19" height="19" rx="6" fill="${colorFor(key)}"/>
         <text x="12" y="16.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0b0d12">${esc((key[0] || '?').toUpperCase())}</text>`;
    return `<svg class="logo" viewBox="0 0 24 24" width="14" height="14" role="img" aria-label="${esc(tool)} logo">${inner}</svg>`;
  };
  const ago = (ms) => {
    if (ms < 1500) return 'now';
    const s = Math.round(ms / 1000);
    if (s < 60) return s + 's';
    const m = Math.round(s / 60);
    return m < 60 ? m + 'm' : Math.round(m / 60) + 'h';
  };
  const clock = (iso) => new Date(iso).toTimeString().slice(0, 8);

  /* ----------------------------------------------- the user talking to agents */

  // What you write goes to one project, so `focus` is the project in that box;
  // `viewAll` is only what the message stream shows, and starts as every
  // project. Picking a project does both: you talk to it, and you watch it.
  let focus = null;
  let viewAll = true;

  const agentsHere = (overview) => {
    if (!focus) return 0;
    const entry = (overview?.otherProjects || []).find((e) => e.project.id === focus.id);
    if (entry) return entry.sessions.length + (entry.running || []).length;
    return (overview?.running || []).filter((r) => r.projectId === focus.id).length;
  };

  function paintNote(overview) {
    $('bproject').disabled = !focus;
    if (focus) $('bproject').value = focus.id;
    $('mtitle').textContent = !viewAll && focus ? `Messages in ${focus.name}` : 'Who is talking to whom';
    $('brief').className = focus ? '' : 'off';
    $('btext').disabled = !focus;
    $('bsave').disabled = !focus || !$('btext').value.trim();
    $('bstate').textContent = focus
      ? `${agentsHere(overview)} agent(s) in this project`
      : 'no project is connected yet';
    if (!focus) {
      $('bhint').className = 'bstate';
      $('bhint').textContent = 'start an agent in a project and you can talk to it here';
    }
  }

  // A composer, not an editor: what you send is a message on the board, kept
  // with the rest of the conversation, and the box empties for the next one.
  async function say() {
    if (!focus) return;
    const project = focus;
    const text = $('btext').value.trim();
    if (!text) return;
    $('bsave').disabled = true;
    try {
      const res = await fetch('/api/say', {
        method: 'POST',
        headers: { ...H, 'content-type': 'application/json' },
        body: JSON.stringify({ project: project.id, name: project.name, text }),
      }).then((r) => {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      });
      $('btext').value = '';
      $('bhint').className = 'bstate ok';
      $('bhint').textContent = res.delivered
        ? `sent to ${res.delivered} agent(s) in ${project.name}`
        : `sent · nobody is listening in ${project.name} yet, so it waits in the log`;
      if (!messages.some((m) => m.seq === res.message.seq)) messages.push(res.message);
      paint();
    } catch {
      $('bhint').className = 'bstate';
      $('bhint').textContent = 'could not send — daemon unreachable';
    }
    $('bsave').disabled = !$('btext').value.trim();
  }

  function renderProjects(overview) {
    const projects = overview.otherProjects || [];
    const apps = overview.apps || [];
    const runningCount = (overview.running || []).length + apps.length;
    const parts = [`${overview.totalActive} connected`];
    if (runningCount) parts.push(`${runningCount} running`);
    parts.push(`${projects.length} project${projects.length === 1 ? '' : 's'}`);
    $('meta').textContent = parts.join(' · ');
    const appRow = (a) => `
      <div class="sess running">
        ${logoFor(a.tool)}
        <span class="badge ghost" style="--c:${colorFor(a.tool)}">${esc(a.tool)}</span>
        <b>pid ${esc(a.pid)}</b>
        <span class="state">running</span>
      </div>`;
    const appsHtml = apps.length
      ? `<div class="project apps"><div class="pname">Applications</div>${apps.map(appRow).join('')}</div>`
      : '';
    const focused = focus ? projects.find((entry) => entry.project.id === focus.id) : null;
    if (focused) focus.name = focused.project.name;
    // Talking needs a project, so the box starts on the first one listed rather
    // than waiting for a click most people never know to make.
    if (!focus && projects.length) focus = { id: projects[0].project.id, name: projects[0].project.name };
    const names = projects.map((entry) => ({ id: entry.project.id, name: entry.project.name }));
    if (focus && !names.some((entry) => entry.id === focus.id)) names.push({ id: focus.id, name: focus.name });
    $('bproject').innerHTML = names
      .map((entry) => `<option value="${esc(entry.id)}"${focus && focus.id === entry.id ? ' selected' : ''}>${esc(entry.name)}</option>`)
      .join('');
    const allRow = `<div class="project allproj${viewAll ? ' sel' : ''}" data-all="1">
      <span class="pname">All projects</span>
      <span class="count">${projects.length}</span>
    </div>`;
    if (!projects.length && !apps.length) {
      $('plist').innerHTML =
        allRow + '<div class="empty">No agents running or connected.<br>Open an agent in a project and it appears here.</div>';
      return;
    }
    $('plist').innerHTML = allRow + appsHtml + projects.map((entry) => {
      const p = entry.project;
      const branch = p.branch ? `<span class="branch">${esc(p.branch)}</span>` : '';
      const same = entry.sameRepo ? '<span class="branch">same repo</span>' : '';
      const sessions = entry.sessions.map((s) => `
        <div class="sess">
          ${logoFor(s.tool)}
          <span class="badge" style="--c:${colorFor(s.tool)}">${esc(s.tool)}</span>
          <b>${esc(s.name)}</b>
          <span class="state">${esc(s.status)} · ${ago(s.idleMs)}</span>
        </div>`).join('');
      const running = (entry.running || []).map((r) => `
        <div class="sess running">
          ${logoFor(r.tool)}
          <span class="badge ghost" style="--c:${colorFor(r.tool)}">${esc(r.tool)}</span>
          <b>pid ${esc(r.pid)}</b>
          <span class="state">running</span>
        </div>`).join('');
      return `<div class="project${!viewAll && focus && focus.id === p.id ? ' sel' : ''}" data-id="${esc(p.id)}" data-name="${esc(p.name)}">
        <div class="pname">${esc(p.name)} ${branch} ${same}</div>
        ${sessions}${running}
      </div>`;
    }).join('');
  }

  // Written by the person at the board, not by an agent (older ones said "you").
  const isUser = (m) => m.from.tool === 'user' || m.from.tool === 'you';

  function renderMessages(messages) {
    if (!messages.length) {
      $('msgs').innerHTML = '<div class="empty">No traffic yet. Messages show up here as agents talk.<br><code>agentbus send "…"</code></div>';
      return;
    }
    $('msgs').innerHTML = messages.map((m) => {
      const target = m.to.kind === 'session' ? 'session' : m.to.kind;
      const who = isUser(m)
        ? '<span class="who user">User</span><span class="arrow">→</span>'
        : `${logoFor(m.from.tool)}<span class="who">${esc(m.from.name)}</span><span class="arrow">(${esc(m.from.tool)}) →</span>`;
      return `<div class="msg">
        <div class="t">${clock(m.time)}</div>
        <div>
          <div class="head">
            <span class="who">${who}</span>
            <span class="to ${target}">${esc(m.to.label)}</span>
            ${viewAll ? `<span class="proj">${esc(m.project.name)}</span>` : ''}
          </div>
          <div class="text">${esc(m.text)}</div>
        </div>
      </div>`;
    }).join('');
  }

  let first = true;
  let messages = [];

  function paint() {
    const box = $('msgs');
    const stick = first || box.scrollHeight - box.scrollTop - box.clientHeight < 60;
    renderMessages(messages);
    if (stick) box.scrollTop = box.scrollHeight;
    first = false;
  }

  async function refresh() {
    try {
      const logUrl =
        viewAll || !focus
          ? '/api/log?limit=150'
          : `/api/log?limit=150&project=${encodeURIComponent(focus.id)}`;
      const [overview, log] = await Promise.all([
        fetch('/api/overview', { headers: H }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
        fetch(logUrl, { headers: H }).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); }),
      ]);
      renderProjects(overview);
      messages = log.messages || [];
      paint();
      paintNote(overview);
    } catch (err) {
      $('dot').className = 'dot dead';
      $('meta').textContent = 'daemon unreachable — is it still running?';
    }
  }

  // One socket instead of a poll: new messages and presence arrive as events.
  function connect() {
    const scheme = location.protocol === 'https:' ? 'wss' : 'ws';
    const token = new URLSearchParams(location.search).get('t') || '';
    const ws = new WebSocket(`${scheme}://${location.host}/ws?t=${encodeURIComponent(token)}`);

    ws.onopen = () => {
      ws.send(JSON.stringify({ type: 'subscribe', mode: 'board' }));
      $('dot').className = 'dot live';
      refresh();
    };

    ws.onmessage = (event) => {
      let payload;
      try { payload = JSON.parse(event.data); } catch { return; }
      if (payload.type === 'message') {
        if (!viewAll && focus && payload.message.project.id !== focus.id) return;
        if (!messages.some((m) => m.seq === payload.message.seq)) messages.push(payload.message);
        paint();
      } else if (payload.type === 'presence' || payload.type === 'ready') {
        refresh();
      }
    };

    ws.onclose = () => {
      $('dot').className = 'dot dead';
      setTimeout(connect, 1000);
    };
  }

  // One project at a time, or all of them: the sidebar chooses.
  $('plist').addEventListener('click', (event) => {
    if (event.target.closest('[data-all]')) {
      viewAll = true;
      refresh();
      return;
    }
    const row = event.target.closest('[data-id]');
    if (!row) return;
    const id = row.getAttribute('data-id');
    const name = row.getAttribute('data-name') || id;
    viewAll = false;
    focus = { id, name };
    refresh();
  });

  $('bproject').addEventListener('change', () => {
    const picker = $('bproject');
    const id = picker.value;
    const name = picker.selectedOptions[0]?.textContent || id;
    viewAll = false;
    focus = { id, name };
    refresh();
  });

  $('btext').addEventListener('input', () => {
    $('bsave').disabled = !$('btext').value.trim();
    $('bhint').className = 'bstate';
    $('bhint').textContent = 'what you send lands in the conversation below, like any other message';
  });

  $('btext').addEventListener('keydown', (event) => {
    if ((event.metaKey || event.ctrlKey) && event.key === 'Enter') say();
  });

  $('bsave').addEventListener('click', say);

  refresh();
  connect();
</script>
</body>
</html>
